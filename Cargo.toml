[package]
name = "jevtrader"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust market engine: Polymarket ingestion + Jev signals + paper trading"

# Core: tokio / reqwest / tungstenite / serde / tracing (AGENTS.md 1.1)
# Venue: Polymarket official Rust SDK (clob, ws, rtds, data, gamma)
# Storage: questdb-rs (ILP ingest) + sqlx (Postgres relational)
[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
polymarket_client_sdk_v2 = { version = "0.8", features = ["clob", "ws", "rtds", "data", "gamma", "tracing"] }
questdb-rs = "6.1.0"
