[package]
name = "jevtrader"
version = "0.1.0"
edition = "2024"
default-run = "jevtrader"
rust-version = "1.88"
description = "Rust market engine: Polymarket ingestion + Jev signals + paper trading"

# Core: tokio / reqwest / tungstenite / serde / tracing (AGENTS.md 1.1)
# Venue: Polymarket official Rust SDK (clob, ws, rtds, data, gamma)
# Storage: questdb-rs (ILP ingest)
[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
polymarket_client_sdk_v2 = { version = "0.8", features = ["clob", "ws", "rtds", "data", "gamma", "tracing"] }
questdb-rs = "6.1.0"
futures-util = "0.3.34"
thiserror = "2.0.20"
smallvec = "1.16.1"
ringbuf = "0.5.2"
hdrhistogram = "7.6.0"
ndarray = "0.17.2"
RustQuant_math = "0.4"
# Historical replay: Parquet chunk streaming (never full-RAM) + report output.
arrow = "60"
parquet = "60"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "feature_builder"
harness = false

[[bench]]
name = "orderbook"
harness = false

[[bench]]
name = "strategy"
harness = false
