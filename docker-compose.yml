---
# Local infra: QuestDB only (time-series). Postgres removed: V1 uses
# QuestDB for all temporal data; no relational store in scope (2026-09-18).
# Usage: docker compose up -d
services:
  questdb:
    image: questdb/questdb:latest
    ports:
      # HTTP / console (host 9000 taken by minio, use :9002)
      - "9002:9000"
      - "8812:8812"  # Postgres wire protocol
      - "9009:9009"  # ILP over TCP (questdb-rs ingest)
    volumes:
      - questdb_data:/var/lib/questdb

volumes:
  questdb_data:
