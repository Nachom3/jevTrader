---
name: ci

on:
  push:
  pull_request:

# Least privilege: jobs only read the repo. (gitleaks needs the token for
# PR comments; everything else runs with read-only contents.)
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned by SHA (see comments for the moving tag each tracks).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action, tracked tag: v2
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
