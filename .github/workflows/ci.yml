---
name: ci

on:
  push:
  pull_request:

# Least privilege: jobs only read the repo. (gitleaks needs the token for
# PR comments; everything else runs with read-only contents.)
permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned by SHA (see comments for the moving tag each tracks).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Plotters links fontconfig at build time.
      # The stock Ubuntu runner does not include it.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned by SHA (see comments for the moving tag each tracks).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action, tracked tag: v2
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
